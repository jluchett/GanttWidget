<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:fleet="http://xmlns.jcp.org/jsf/composite/fleetgantt">
<h:head>
    <title>Men&#250; servicio &#8594; Monitor de ocupaci&#243;n de flota</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</h:head>
<h:body class="fg-app-body">

    <!-- 1. Título corporativo Transkal -->
    <div class="fg-page-header">
        <span class="tk-title-prefix">Men&#250; servicio</span>
        <span class="tk-title-arrow">&#8594;</span>
        <span class="tk-title-main">Monitor de ocupaci&#243;n de flota</span>
    </div>

    <!-- 2. Caja de Leyenda con fondo Transkal y chips interactivos -->
    <div class="fg-legend-card" id="fgGlobalLegend">
        <span class="fg-legend-title">ESTADOS:</span>
        <div class="fg-legend-item" data-status="en_viaje" title="Filtrar por En viaje">
            <span class="fg-legend-swatch fg-status-en_viaje"></span> En viaje
        </div>
        <div class="fg-legend-item" data-status="en_carga" title="Filtrar por En carga">
            <span class="fg-legend-swatch fg-status-en_carga"></span> En carga
        </div>
        <div class="fg-legend-item" data-status="mantenimiento" title="Filtrar por Mantenimiento">
            <span class="fg-legend-swatch fg-status-mantenimiento"></span> Mantenimiento
        </div>
        <div class="fg-legend-item" data-status="averiado" title="Filtrar por Averiado">
            <span class="fg-legend-swatch fg-status-averiado"></span> Averiado
        </div>
        <div class="fg-legend-item" data-status="descanso" title="Filtrar por Descanso">
            <span class="fg-legend-swatch fg-status-descanso"></span> Descanso
        </div>
        <div class="fg-legend-item" data-status="retrasado" title="Filtrar por Retrasado">
            <span class="fg-legend-swatch fg-status-retrasado"></span> Retrasado
        </div>
        <div class="fg-legend-item" data-status="cancelado" title="Filtrar por Cancelado">
            <span class="fg-legend-swatch fg-status-cancelado"></span> Cancelado
        </div>
        <div class="fg-legend-item" data-status="libre" title="Filtrar por Libre">
            <span class="fg-legend-swatch fg-status-libre"></span> Libre
        </div>
        <div class="fg-legend-item" data-status="reservado" title="Filtrar por Reservado">
            <span class="fg-legend-swatch fg-status-reservado"></span> Reservado
        </div>
        <div class="fg-legend-item fg-legend-conflict" data-action="conflict" title="Filtrar actividades en conflicto">
            <span class="fg-legend-swatch fg-swatch-conflict"></span> Solapamiento (Conflicto)
        </div>
    </div>

    <!-- 3. Visor Gantt de Flota -->
    <fleet:viewer id="ganttFlota"
                  data="#{fleetGanttBean.fleetScheduleJson}"
                  height="calc(100vh - 110px)" />

</h:body>
</html>
