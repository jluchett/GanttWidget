<ui:component xmlns="http://www.w3.org/1999/xhtml"
              xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
              xmlns:cc="http://xmlns.jcp.org/jsf/composite"
              xmlns:h="http://xmlns.jcp.org/jsf/html">

    <cc:interface>
        <!-- JSON con resources y tasks -->
        <cc:attribute name="data" required="true" type="java.lang.String" />
        <cc:attribute name="height" default="calc(100vh - 110px)" type="java.lang.String" />
    </cc:interface>

    <cc:implementation>
        <!-- Carga de CSS y JS desde la librería fleetgantt -->
        <h:outputStylesheet library="fleetgantt" name="fleet-gantt.css" />
        <h:outputScript library="fleetgantt" name="fleet-gantt.js" />

        <div id="#{cc.clientId}_wrapper" class="fg-container" style="height: #{cc.attrs.height};"></div>

        <!-- Contenedor seguro para inyectar datos JSON sin colisiones de comillas -->
        <script id="#{cc.clientId}_data" type="application/json">#{cc.attrs.data}</script>

        <script type="text/javascript">
            // <![CDATA[
            (function() {
                var initGantt = function() {
                    var dataEl = document.getElementById("#{cc.clientId}_data");
                    var rawData = dataEl ? dataEl.textContent : "{}";
                    new FleetGanttViewer({
                        containerId: "#{cc.clientId}_wrapper",
                        data: rawData,
                        defaultZoomHours: 2
                    });
                };

                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', initGantt);
                } else {
                    initGantt();
                }
            })();
            // ]]>
        </script>
    </cc:implementation>
</ui:component>
